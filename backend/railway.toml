# ============================================================
# Railway Deployment Configuration for VEYRO Backend
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "java -jar -Djava.security.egd=file:/dev/./urandom app.jar"
healthcheckPath = "/api-docs"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
