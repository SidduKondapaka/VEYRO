# Test profile properties using H2 in-memory database
spring.application.name=veyro-backend-test
spring.datasource.url=jdbc:h2:mem:veyro_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

veyro.app.jwtSecret=veyroSecureMarketplaceSuperSecretKey2026MustBeAtLeast256BitsLong!
veyro.app.jwtExpirationMs=86400000
veyro.app.jwtRefreshExpirationMs=604800000
veyro.app.cors.allowedOrigins=http://localhost:5173
