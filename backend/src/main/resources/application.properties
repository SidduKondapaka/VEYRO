# ============================================================
# VEYRO Spring Boot Application Configuration
# ============================================================
spring.application.name=veyro-backend

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# MySQL Database DataSource
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:veyro_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:veyro}
spring.datasource.password=${DB_PASSWORD:Veyro@2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=VeyroHikariCP

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Spring MVC / JSON
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=UTC

# JWT Security Configuration
veyro.app.jwtSecret=${JWT_SECRET:veyroSecureMarketplaceSuperSecretKey2026MustBeAtLeast256BitsLong!}
veyro.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
veyro.app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS Configuration
veyro.app.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.veyro=INFO
logging.level.org.springframework.security=WARN
